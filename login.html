<!DOCTYPE html>

<html>

<head>

    <title>Login - CodeAlpha Store</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        CodeAlpha Store
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </nav>

</header>


<div class="form-container">

    <h2>
        Login
    </h2>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">
            Register
        </a>
    </p>

</div>

</body>

</html>
